<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Wedding Check-In</title><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(520px,100%);margin:auto;padding:28px 20px 40px;text-align:center}h1{margin:8px 0 6px;font-size:30px}.sub{color:#666;margin-bottom:24px}.scan{display:flex;align-items:center;justify-content:center;width:100%;min-height:150px;padding:24px;border-radius:18px;background:#222;color:#fff;font-size:24px;font-weight:700;cursor:pointer;border:0}.scan:active{transform:scale(.99)}input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.result{margin-top:20px;padding:24px 18px;min-height:130px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}.success{border:3px solid #16803c}.duplicate{border:3px solid #c62828}.error{border:3px solid #b26a00}.ready{border:3px solid #999}.big{font-size:25px;font-weight:800}.small{color:#555;font-size:16px}#status{margin-top:12px;min-height:20px;color:#666}</style></head><body><div class="wrap"><h1>Wedding Check-In</h1><div class="sub">Photograph the QR code on the invitation</div><label class="scan" for="qrPhoto">📷 &nbsp; SCAN INVITATION</label><input id="qrPhoto" type="file" accept="image/*" capture="environment"><div id="status"></div><div id="result" class="result ready"><div class="big">Ready</div><div class="small">Tap the button to photograph the QR code.</div></div></div><script>
const input=document.getElementById('qrPhoto'),result=document.getElementById('result'),statusEl=document.getElementById('status');
function show(type,title,message){result.className='result '+type;result.innerHTML=`<div class="big">${title}</div><div class="small">${message}</div>`}
async function decodeImage(file){const bitmap=await createImageBitmap(file);const maxDim=1800,scale=Math.min(1,maxDim/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);const d=ctx.getImageData(0,0,canvas.width,canvas.height);const code=jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});return code?code.data.trim():null}
input.addEventListener('change',async()=>{const file=input.files&&input.files[0];if(!file)return;statusEl.textContent='Reading QR code…';show('ready','Processing…','Decoding the photograph.');try{const invitation=await decodeImage(file);if(!invitation){show('error','⚠ QR NOT FOUND','The QR code could not be read. Photograph it closer and try again.');return}if(!/^\\d+$/.test(invitation)){show('error','⚠ INVALID QR',`QR contains: ${invitation}`);return}statusEl.textContent='Checking invitation…';google.script.run.withSuccessHandler(r=>{if(r.type==='success')show('success','✓ CHECK-IN SUCCESSFUL',`Invitation #${r.invitation}<br>Checked in at ${r.time}`);else if(r.type==='duplicate')show('duplicate','⚠ ALREADY CHECKED IN',`Invitation #${r.invitation}<br>Already checked in at ${r.time}`);else show('error','⚠ NOT VALID',r.message||'Unable to check in.');statusEl.textContent=''}).withFailureHandler(e=>{show('error','⚠ CONNECTION ERROR',e&&e.message?e.message:'Could not contact the check-in database.');statusEl.textContent=''}).checkIn(invitation)}catch(e){show('error','⚠ PHOTO ERROR',e.message||String(e));statusEl.textContent=''}finally{input.value=''}});
</script></body></html>
